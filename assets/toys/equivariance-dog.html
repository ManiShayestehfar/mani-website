      ch[3][q] = Math.max(0, -gy[q]); ch[4][q] = Math.max(0, a - b); ch[5][q] = Math.max(0, c - d);
      ch[6][q] = Math.max(0, .22 - l3[q]); ch[7][q] = Math.max(0, g3[q] - (r3[q] + b3[q])/2 - .02); ch[8][q] = Math.max(0, r3[q] - g3[q] - .06); }
    SC.c ??= ch.map(c => pct(c, .995));
    const img = co.createImageData(W, H), dd = img.data;
    for (let k = 0; k < 9; k++){ const ox = (k % 3) * w, oy = (k / 3 | 0) * h, s = SC.c[k];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
        const v = 255 * Math.min(1, ch[k][y*w + x] / s), q = 4 * ((oy + y)*W + ox + x);
        dd[q] = dd[q+1] = dd[q+2] = v; dd[q+3] = 255; } }
    co.putImageData(img, 0, 0);
    co.fillStyle = '#fff'; for (let i = 1; i < 3; i++){ co.fillRect(i*w - 1, 0, 2, H); co.fillRect(0, i*h - 1, W, 2); } },
  /* 3: strided max-pooling (not translation equivariant) */ () => {
    const h = feat()[0], S = 15, w = W / S, hh = H / S, pool = new Float32Array(w*hh);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const q = (y/S | 0)*w + (x/S | 0); if (h[y*W+x] > pool[q]) pool[q] = h[y*W+x]; }
    SC.s ??= pct(pool, .99);
    const img = co.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const p = y*W + x, q = 4*p;
      const k = 3 * (255 * Math.min(1, Math.max(0, (pool[(y/S | 0)*w + (x/S | 0)] - .35*SC.s) / (.65*SC.s))) | 0);
      d[q] = LUT[k]; d[q+1] = LUT[k+1]; d[q+2] = LUT[k+2]; d[q+3] = 255; }
    co.putImageData(img, 0, 0); }
];

function compose(){ cx.drawImage(BG, 0, 0, W, H); cx.drawImage(DOG, pos.x, pos.y, DW, DH); }
function computeF(){ compose(); readX(); F[fi](); }

const VX = document.getElementById('vx'), VY = document.getElementById('vy');
const fm = v => (v < 0 ? '\u2212' : '') + Math.abs(v);
function gvec(){ // g on the right: its translation vector, in pixels, up = positive
  const a = fm(Math.round(pos.x - HOME.x)), b = fm(Math.round(HOME.y - pos.y));
  if (VX.textContent !== a) VX.textContent = a;
  if (VY.textContent !== b) VY.textContent = b; }
function arrow(ctx){
  const x0 = HOME.x + DW/2, y0 = HOME.y + DH/2, vx = pos.x - HOME.x, vy = pos.y - HOME.y, len = Math.hypot(vx, vy);
  if (len < 8) return;
  const x1 = x0 + vx, y1 = y0 + vy, ux = vx/len, uy = vy/len, hl = 15;
  const head = () => { ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - hl*ux + hl*.55*uy, y1 - hl*uy - hl*.55*ux); ctx.lineTo(x1 - hl*ux - hl*.55*uy, y1 - hl*uy + hl*.55*ux); ctx.closePath(); };
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - hl*.6*ux, y1 - hl*.6*uy); ctx.stroke(); head(); ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#3b3f9c'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - hl*.6*ux, y1 - hl*.6*uy); ctx.stroke(); head(); ctx.fillStyle = '#3b3f9c'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x0, y0, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#3b3f9c'; ctx.beginPath(); ctx.arc(x0, y0, 3, 0, 7); ctx.fill();
  ctx.restore(); }

/* render loop: recompute f only when the dog moved; trails decay for a moment after release */
let moved = true, dragging = false, fade = 0, running = false, active = true;
function clearTrails(){ ta.clearRect(0, 0, W, H); tb.fillStyle = '#000'; tb.fillRect(0, 0, W, H); }
function frame(){
  if (!active || document.hidden){ running = false; return; }
  if (moved) computeF();
  ta.globalCompositeOperation = 'destination-out'; ta.fillStyle = 'rgba(0,0,0,.06)'; ta.fillRect(0, 0, W, H); ta.globalCompositeOperation = 'source-over';
  tb.fillStyle = 'rgba(0,0,0,.08)'; tb.fillRect(0, 0, W, H);
  if (moved && dragging){ ta.globalAlpha = .45; ta.drawImage(DOG, pos.x, pos.y, DW, DH); ta.globalAlpha = 1;
    tb.globalCompositeOperation = 'lighten'; tb.drawImage(O, 0, 0); tb.globalCompositeOperation = 'source-over'; }
  ca.drawImage(BG, 0, 0, W, H); ca.drawImage(TA, 0, 0); ca.drawImage(DOG, pos.x, pos.y, DW, DH); arrow(ca);
  gvec(); cb.drawImage(O, 0, 0); cb.save(); cb.globalCompositeOperation = 'lighten'; cb.globalAlpha = .6; cb.drawImage(TB, 0, 0); cb.restore(); arrow(cb);
  moved = false;
  if (dragging || fade-- > 0) requestAnimationFrame(frame); else running = false; }
function kick(){ if (active && !document.hidden && !running){ running = true; requestAnimationFrame(frame); } }

const pt = e => { const r = A.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
const onDog = (x, y) => x >= pos.x && x <= pos.x + DW && y >= pos.y && y <= pos.y + DH;
let grab = null;
A.addEventListener('pointerdown', e => { const [x, y] = pt(e); if (!onDog(x, y)) return;
  grab = [x - pos.x, y - pos.y]; dragging = true; A.setPointerCapture(e.pointerId); A.style.cursor = 'grabbing'; kick(); });
A.addEventListener('pointermove', e => { const [x, y] = pt(e);
  if (!grab){ A.style.cursor = onDog(x, y) ? 'grab' : 'default'; return; }
  pos = { x: Math.min(W - DW/2, Math.max(-DW/2, x - grab[0])), y: Math.min(H - DH/2, Math.max(-DH/2, y - grab[1])) }; moved = true; });
const end = () => { if (!grab) return; grab = null; dragging = false; fade = 60; A.style.cursor = 'grab'; };
A.addEventListener('pointerup', end); A.addEventListener('pointercancel', end); A.addEventListener('lostpointercapture', end);
A.addEventListener('dblclick', () => { pos = { ...HOME }; moved = true; clearTrails(); kick(); });

const btns = [...document.querySelectorAll('.fs button')];
function setF(k){ fi = k; btns.forEach((b, i) => b.setAttribute('aria-pressed', String(i === k))); clearTrails(); moved = true; kick(); }
btns.forEach((b, i) => b.addEventListener('click', () => setF(i)));
document.getElementById('f').addEventListener('click', () => setF((fi + 1) % 4));
document.addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '4') setF(+e.key - 1); });

window.addEventListener('message', e => {
  if (e.source !== window.parent || e.origin !== window.location.origin || e.data?.type !== 'equivariance-visibility') return;
  active = e.data.visible === true;
  if (!active) end(); else kick();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) end(); else kick(); });

/* fix the colour scales from the untranslated image, so brightness never jumps */
compose(); readX(); for (let k = 3; k >= 0; k--) F[k]();
clearTrails(); moved = true; kick();
})();
</script>
<script>
(() => {
  if (window.parent === window) return;
  const wrap = document.querySelector('.wrap');
  const reportSize = () => window.parent.postMessage({
    type: 'equivariance-size', height: wrap.getBoundingClientRect().height
  }, window.location.origin);
  if ('ResizeObserver' in window) new ResizeObserver(reportSize).observe(wrap);
  window.addEventListener('resize', reportSize);
  reportSize();
})();
</script>
</body>
